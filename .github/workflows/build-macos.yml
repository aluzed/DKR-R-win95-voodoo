name: Build macOS Core
on: [push, pull_request]
jobs:
  macos-core:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure asset-free core
        run: >-
          cmake -S . -B build/macos-core -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DDKRPORT_BUILD_NATIVE_UI=OFF
          -DDKRPORT_BUILD_TESTS=ON
          -DDKRPORT_ENABLE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/macos-core --parallel
      - name: Test
        run: ctest --test-dir build/macos-core --output-on-failure
      - name: Headless self-test
        run: ./build/macos-core/bin/Release/DKRPort --headless-self-test --portable
